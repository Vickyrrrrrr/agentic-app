appId: live.buildstack.agentic
productName: AgentIC
copyright: Copyright © 2024-2026 AgentIC

protocols:
  - name: AgentIC Desktop
    schemes:
      - agentic

directories:
  buildResources: resources
  output: dist

files:
  - out/**/*
  - "!out/renderer/**/*"

extraResources:
  - from: out/renderer
    to: renderer
  - from: resources/license.json
    to: license.json
  - from: resources/backend
    to: backend
    filter:
      - "**/*"
  - from: ../server
    to: server
    filter:
      - "**/*"
      - "!**/__pycache__/**"
      - "!**/.pytest_cache/**"
      - "!**/.mypy_cache/**"
      - "!**/.ruff_cache/**"
      - "!**/*.pyc"
      - "!**/.env"
      - "!**/.env.*"
      - "!**/*.log"
      - "!**/.agentic-state/**"

asar: true
compression: maximum

mac:
  category: public.app-category.developer-tools
  icon: resources/icon.icns
  darkModeSupport: true
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

dmg:
  artifactName: AgentIC-${version}-${arch}.dmg

win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  artifactName: AgentIC-Setup-${version}.exe

linux:
  icon: resources/icon.png
  category: Development
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64

appImage:
  artifactName: AgentIC-${version}-${arch}.AppImage

publish:
  provider: github
  owner: Vickyrrrrrr
  repo: AgentIC
  releaseType: release
