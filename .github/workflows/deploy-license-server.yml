name: Deploy License Server to VPS

on:
  push:
    branches: [ main ]
    paths:
      - 'license-server/**'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Oracle VPS
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Copy License Server Files via SCP
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          source: "license-server/*"
          target: "/opt/agentic-license"
          strip_components: 1

      - name: SSH Remote Command to Rebuild Docker
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          script: |
            cd /opt/agentic-license
            docker compose up --build -d
