name: CI — test, smoke, release (Linux)

# Single pipeline: every push/PR runs tests; version tags additionally
# freeze the engine and publish the Linux AppImage. No path filters on
# purpose — tag pushes must never be skipped because of which files changed.
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  python-tests:
    name: Engine contract + core goldens
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install test deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: Run engine tests
        run: python -m pytest tests/ -q

  backend-boot-smoke:
    name: Engine boot smoke (linux)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: server/requirements.txt

      - name: Install engine deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Boot engine and probe endpoints
        run: |
          AGENTIC_PORT=17860 python main.py & echo $! > engine.pid
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:17860/health && break || sleep 2
          done
          curl -fs http://127.0.0.1:17860/opencode/bridge/health
          curl -fs http://127.0.0.1:17860/version
          curl -fs http://127.0.0.1:17860/tools/status -o /dev/null
          kill $(cat engine.pid)

  desktop-lint:
    name: Desktop lint (oxlint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/agentic-desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install desktop dependencies
        run: bun install

      - name: Lint
        run: bun run lint

  prepare-release:
    name: Prepare buildstack release
    if: startsWith(github.ref, 'refs/tags/v*') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          version="$(node -p "require('./apps/agentic-desktop/packages/desktop/package.json').version")"
          tag="v${version}"

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            expected="v${version}"
            if [[ "${tag}" != "${expected}" ]]; then
              echo "Tag ${tag} does not match desktop package version ${expected}."
              exit 1
            fi
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Create or reuse buildstack release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_TOKEN is required to publish AgentIC Desktop to Vickyrrrrrr/buildstack releases."
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo Vickyrrrrrr/buildstack > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo Vickyrrrrrr/buildstack \
              --title "$RELEASE_VERSION" \
              --latest
          else
            gh release create "$RELEASE_TAG" \
              --repo Vickyrrrrrr/buildstack \
              --title "$RELEASE_VERSION" \
              --notes "$RELEASE_TAG" \
              --latest
          fi

  release:
    name: Freeze engine, build & publish AppImage
    needs: [prepare-release, python-tests, backend-boot-smoke]
    if: startsWith(github.ref, 'refs/tags/v*') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      AGENTIC_LOCAL_URL: http://127.0.0.1:7860
      AGENTIC_MODE: advisor
      OPENCODE_DEFAULT_AGENT: agentic-vlsi
      OPENCODE_CHANNEL: prod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Linux packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libarchive-tools

      - name: Freeze engine backend binary
        working-directory: server
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller
          python scripts/freeze_backend.py

      - name: Install desktop dependencies
        working-directory: apps/agentic-desktop
        run: bun install

      - name: Build desktop app
        working-directory: apps/agentic-desktop/packages/desktop
        env:
          NODE_OPTIONS: --max-old-space-size=4096
        run: bun run build

      - name: Publish to GitHub Releases
        working-directory: apps/agentic-desktop/packages/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_TOKEN is required to publish AgentIC Desktop to Vickyrrrrrr/buildstack releases."
            exit 1
          fi
          bunx electron-builder --linux AppImage --publish always --config electron-builder.config.ts
