name: AgentIC Desktop Preview

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'codex/**'
    paths:
      - 'apps/agentic-desktop/**'
      - '.github/workflows/agentic-desktop-preview.yml'

jobs:
  preview:
    name: Build preview ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            package_flag: --linux
          - os: windows-latest
            platform: windows
            package_flag: --win
          - os: macos-latest
            platform: macos
            package_flag: --mac

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm libarchive-tools

      - name: Install dependencies
        working-directory: apps/agentic-desktop
        run: bun install --frozen-lockfile

      - name: Build desktop app
        working-directory: apps/agentic-desktop/packages/desktop
        env:
          AGENTIC_LOCAL_URL: http://127.0.0.1:7860
          AGENTIC_MODE: advisor
          OPENCODE_DEFAULT_AGENT: agentic-vlsi
          OPENCODE_CHANNEL: dev
        run: bun run build

      - name: Package preview installer
        working-directory: apps/agentic-desktop/packages/desktop
        env:
          AGENTIC_LOCAL_URL: http://127.0.0.1:7860
          AGENTIC_MODE: advisor
          OPENCODE_DEFAULT_AGENT: agentic-vlsi
          OPENCODE_CHANNEL: dev
        run: bunx electron-builder ${{ matrix.package_flag }} --publish never --config electron-builder.config.ts

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: agentic-desktop-preview-${{ matrix.platform }}
          path: apps/agentic-desktop/packages/desktop/dist/*
