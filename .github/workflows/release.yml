name: Release AgentIC Desktop — Linux & macOS

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  prepare-release:
    name: Prepare buildstack release
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      version: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release metadata
        id: meta
        shell: bash
        run: |
          version="$(node -p "require('./apps/agentic-desktop/packages/desktop/package.json').version")"
          tag="v${version}"

          if [[ "${GITHUB_EVENT_NAME}" == "push" && "${GITHUB_REF_TYPE}" == "tag" ]]; then
            tag="${GITHUB_REF_NAME}"
            expected="v${version}"
            if [[ "${tag}" != "${expected}" ]]; then
              echo "Tag ${tag} does not match desktop package version ${expected}."
              exit 1
            fi
          fi

          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Create or reuse buildstack release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_TOKEN is required to publish AgentIC Desktop to Vickyrrrrrr/buildstack releases."
            exit 1
          fi

          if gh release view "$RELEASE_TAG" --repo Vickyrrrrrr/buildstack > /dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --repo Vickyrrrrrr/buildstack \
              --title "$RELEASE_VERSION" \
              --latest
          else
            gh release create "$RELEASE_TAG" \
              --repo Vickyrrrrrr/buildstack \
              --title "$RELEASE_VERSION" \
              --notes "$RELEASE_TAG" \
              --latest
          fi

  release:
    name: Build & publish ${{ matrix.platform }}
    needs: prepare-release
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux: AppImage runs on every distro (Ubuntu, RHEL, Fedora, Rocky, Arch…)
          - os: ubuntu-22.04
            platform: linux
            runtime_platform: linux
            runtime_arch: x64
            package_flag: --linux AppImage
          # macOS Intel
          - os: macos-13
            platform: macos-intel
            runtime_platform: darwin
            runtime_arch: x64
            package_flag: --mac dmg zip --x64
          # macOS Apple Silicon
          - os: macos-14
            platform: macos-apple-silicon
            runtime_platform: darwin
            runtime_arch: arm64
            package_flag: --mac dmg zip --arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            server/requirements-build.txt
            server/requirements.txt

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libarchive-tools

      - name: Install desktop dependencies
        working-directory: apps/agentic-desktop
        run: bun install

      - name: Build desktop app
        working-directory: apps/agentic-desktop/packages/desktop
        env:
          AGENTIC_LOCAL_URL: http://127.0.0.1:7860
          AGENTIC_MODE: advisor
          OPENCODE_DEFAULT_AGENT: agentic-vlsi
          OPENCODE_CHANNEL: prod
          NODE_OPTIONS: --max-old-space-size=4096
        run: bun run build

      - name: Publish to GitHub Releases
        working-directory: apps/agentic-desktop/packages/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          AGENTIC_LOCAL_URL: http://127.0.0.1:7860
          AGENTIC_MODE: advisor
          OPENCODE_DEFAULT_AGENT: agentic-vlsi
          OPENCODE_CHANNEL: prod
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_TOKEN is required to publish AgentIC Desktop to Vickyrrrrrr/buildstack releases."
            exit 1
          fi
          bunx electron-builder ${{ matrix.package_flag }} --publish always --config electron-builder.config.ts
