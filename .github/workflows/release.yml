name: Release AgentIC Desktop

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    name: Build & publish ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            package_flag: --linux AppImage deb
          - os: windows-latest
            platform: windows
            package_flag: --win nsis
          - os: macos-latest
            platform: macos
            package_flag: --mac dmg zip

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            server/requirements-build.txt
            server/requirements.txt

      - name: Install Linux packaging dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libarchive-tools

      - name: Install desktop dependencies
        working-directory: apps/agentic-desktop
        run: bun install --frozen-lockfile

      - name: Build desktop app
        working-directory: apps/agentic-desktop/packages/desktop
        env:
          AGENTIC_LOCAL_URL: http://127.0.0.1:7860
          AGENTIC_MODE: advisor
          OPENCODE_DEFAULT_AGENT: agentic-vlsi
          OPENCODE_CHANNEL: prod
        run: bun run build

      - name: Build AgentIC backend runtime
        working-directory: apps/agentic-desktop/packages/desktop
        run: bun run build:agentic-backend

      - name: Publish to GitHub Releases
        working-directory: apps/agentic-desktop/packages/desktop
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN || github.token }}
          AGENTIC_LOCAL_URL: http://127.0.0.1:7860
          AGENTIC_MODE: advisor
          OPENCODE_DEFAULT_AGENT: agentic-vlsi
          OPENCODE_CHANNEL: prod
        run: |
          bunx electron-builder ${{ matrix.package_flag }} --publish always --config electron-builder.config.ts
