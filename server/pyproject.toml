[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-server"
version = "0.1.0"
description = "AgentIC local VLSI engine (FastAPI host + deterministic VLSI core)"
readme = "README.md"
requires-python = ">=3.10"
# Runtime deps stay in requirements.txt (single source) until the
# requirements freeze is promoted here. Install with: pip install -e .
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
