version: '3.8'

services:
  agentic-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: agentic_onprem_server
    restart: always
    ports:
      - "7860:7860"
    environment:
      - PORT=7860
      - AGENTIC_ALLOWED_ORIGINS=*
      - WORKSPACE_ROOT=/workspace
    volumes:
      - ./workspace:/workspace
      - /nfs/projects:/nfs/projects:ro
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7860/health"]
      interval: 30s
      timeout: 10s
      retries: 3
